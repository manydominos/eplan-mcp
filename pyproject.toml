# Packaging added by manydominos (fork): `uvx --from <this repo's archive> eplan-mcp`
# runs the local EPLAN server (python/) without a checkout. python/ is shipped as it is.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eplan-mcp"
version = "1.0.0"
description = "EPLAN Electric P8 MCP server (Canary-ECAD/eplan-mcp), packaged for uvx"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian D. Lopez / Canary E-cad (original authors)" }]
dynamic = ["dependencies"]

[project.scripts]
eplan-mcp = "eplan_mcp_server._launcher:main"

[project.urls]
Homepage = "https://github.com/manydominos/eplan-mcp"
Original = "https://github.com/Canary-ECAD/eplan-mcp"

[tool.setuptools]
packages = ["eplan_mcp_server"]
package-dir = { "eplan_mcp_server" = "python" }
include-package-data = false

[tool.setuptools.package-data]
eplan_mcp_server = ["**/*"]

[tool.setuptools.exclude-package-data]
eplan_mcp_server = ["**/__pycache__/*", "**/*.pyc", ".venv/**", "tests/**"]

[tool.setuptools.dynamic]
dependencies = { file = ["python/mcp_server/requirements.txt"] }
